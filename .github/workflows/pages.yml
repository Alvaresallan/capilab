name: Publish CapiLab Web

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified Web release
        run: |
          curl --fail --location --retry 3 --output capilab.zip https://github.com/Alvaresallan/capilab/releases/download/web-v0.6.2/CapiLab-Web-v0.6.2.zip
          echo "8a9e44399f598a7c2e29147202c3b279f6d9017e37d86d38b033412952db7e0a  capilab.zip" | sha256sum --check
          unzip -q capilab.zip -d _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
